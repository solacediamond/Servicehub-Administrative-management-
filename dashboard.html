<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07070d">
<title>ServiceHub Admin</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<link rel="stylesheet" href="css/glass.css">
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="page">
  <header class="topbar glass">
    <a class="brand" href="#/"><img class="logo" src="assets/logo-192.png" alt="" width="44" height="44"><div><b>ServiceHub</b><small>Admin</small></div></a>
    <div class="who"><span id="whoName"></span><button class="btn btn-ghost btn-xs" id="logout">Sign out</button></div>
  </header>

  <form class="searchbar glass" id="searchForm" role="search" novalidate>
    <label class="sr" for="q">Find a listing</label>
    <input class="input" id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Listing ID or manage link">
    <button class="btn btn-primary" id="searchBtn" type="submit">Find</button>
  </form>
  <p class="search-msg" id="searchMsg" hidden></p>

  <main id="app"></main>
  <p class="foot" id="foot"></p>
</div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
