<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07070d">
<title>ServiceHub Admin</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<link rel="stylesheet" href="css/glass.css">
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<main class="center">
  <section class="card glass">
    <div class="brand"><img class="logo" src="assets/logo-192.png" alt="" width="44" height="44"><div><b>ServiceHub</b><small>Admin</small></div></div>
    <h1>Sign in</h1>
    <p class="muted" style="margin-bottom:22px">For approved admins only.</p>

    <p class="form-note" id="note" hidden></p>
    <p class="form-error" id="error" role="alert" hidden></p>

    <form id="loginForm" novalidate>
      <label class="field"><span>Admin name</span>
        <input class="input" name="username" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      </label>
      <label class="field"><span>Password</span>
        <div class="pw">
          <input class="input" name="password" type="password" autocomplete="off" required>
          <button class="linkbtn toggle" type="button" id="togglePw">Show</button>
        </div>
      </label>
      <button class="btn btn-primary btn-block" id="submit" type="submit">Sign in</button>
    </form>

    <div class="under"><a class="linkbtn" href="apply.html">Apply to be an admin</a></div>
    <div class="under" id="demoPill" hidden><span class="demo-pill">Demo mode with test data</span></div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
